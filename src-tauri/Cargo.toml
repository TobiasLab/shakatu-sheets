[package]
name = "shakatu-sheets"
version = "0.1.1"
description = "Local-first Black Desert Online silver-per-hour tracker"
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "shakatu_sheets_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
quick-xml = "=0.41.0"
png = "0.18"
reqwest = { version = "0.13", default-features = false, features = ["query", "rustls"] }
rusqlite = { version = "0.38", features = ["bundled"] }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["screencast", "tokio"] }
gtk = "0.18"
gtk-layer-shell = { version = "0.8.2", features = ["v0_6"] }
pipewire = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.61.3", features = [
    "Foundation", "Foundation_Metadata", "Graphics_Capture", "Graphics_DirectX_Direct3D11",
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi_Common",
    "Win32_System_WinRT_Direct3D11", "Win32_UI_Shell", "Win32_System_StationsAndDesktops",
    "Win32_System_SystemInformation", "Wdk_System_SystemServices",
    "Win32_System_WinRT_Graphics_Capture", "Win32_UI_WindowsAndMessaging",
    "Security_Authorization_AppCapabilityAccess"
] }
windows-future = "=0.2.1"
